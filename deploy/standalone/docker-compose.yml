# Prebuilt image — no Go toolchain, no source tree.
# Docs: https://github.com/Rnurdaulet/pingbot/tree/master/deploy/standalone

services:
  pingbot:
    image: ghcr.io/rnurdaulet/pingbot:latest
    restart: unless-stopped
    # The image runs as nonroot (uid 65532). If config.yaml / data/ are not
    # readable by it (e.g. chmod 660, owned by your user), run as their owner:
    # user: "1000:1000"
    env_file: .env
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./data:/data
    # Behind a reverse proxy on the `proxy` network (recommended).
    # For a quick local smoke test without a proxy, uncomment:
    # ports:
    #   - "8080:8080"
    expose:
      - "8080"
    networks:
      - proxy

networks:
  proxy:
    external: true
